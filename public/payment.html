<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HQ — Complete Your Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header minimal">
    <div class="container nav-row">
      <div class="logo">HQ</div>
      <nav class="nav">
        <a href="home.html" class="nav-link">Home</a>
      </nav>
    </div>
  </header>

  <main class="container page-fade">
    <section class="payment-section">
      <h2>Complete Your Payment</h2>
      <p class="muted">Scan the QR code below to continue.</p>

      <div class="qr-placeholder glass">
        <div class="qr-box">
          <!-- Placeholder box -->
          <div class="qr-center">QR CODE</div>
        </div>
      </div>

      <div class="payment-actions">
        <button id="paidBtn" class="btn primary large ripple">I have completed payment</button>
      </div>

      <div id="paymentNote" class="payment-note" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
