<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HQ — Select Subject</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header minimal">
    <div class="container nav-row">
      <div class="logo">HQ</div>
      <nav class="nav">
        <a href="home.html" class="nav-link">Back</a>
      </nav>
    </div>
  </header>

  <main class="container page-fade">
    <section class="hero">
      <h2 class="hero-title">Select Subject</h2>
      <p class="hero-sub selected-class-label">Selected Class: <span id="selectedClassLabel">—</span></p>

      <div class="cards-grid subject-grid">
        <div class="card subject-card" data-subject="Science">
          <div class="card-content">
            <svg class="subject-ico" width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h3>Science</h3>
            <p>Physics, Chemistry & Biology resources.</p>
          </div>
        </div>

        <div class="card subject-card" data-subject="Mathematics">
          <div class="card-content">
            <svg class="subject-ico" width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M7 6v12M17 6v12" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h3>Mathematics</h3>
            <p>Concepts, problem-solving and practice.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
